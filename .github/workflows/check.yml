name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Isolate native Windows homes
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "friction-native-ci"
          $user = Join-Path $root "user"
          $codex = Join-Path $root "codex"
          $local = Join-Path $root "local-app-data"
          $npmPrefix = Join-Path $root "npm-prefix"
          New-Item -ItemType Directory -Force $root, $user, $codex, $local, $npmPrefix | Out-Null
          "HOME=$user" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "USERPROFILE=$user" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$local" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRICTION_HOME=$(Join-Path $root 'private')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_HOME=$codex" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CONFIG_PREFIX=$npmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Probe native Windows store stages
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $probeScript = @'
          import { mkdir, mkdtemp } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import path from "node:path";
          import { securePrivateDirectory, verifyPrivateDirectory } from "./src/platform/windows/acl.ts";
          import { inspectWindowsPathComponents } from "./src/platform/windows/reparse.ts";
          import { ensureEventStore } from "./src/storage/private-store.ts";
          const root = await mkdtemp(path.join(tmpdir(), "friction-store-probe-"));
          const home = path.join(root, "home");
          const volume = path.parse(home).root;
          await inspectWindowsPathComponents(volume, home, "directory-or-missing");
          console.log("missing-path-ok");
          await mkdir(home);
          await inspectWindowsPathComponents(volume, home, "directory");
          console.log("created-path-ok");
          console.log(await securePrivateDirectory(home));
          console.log(await verifyPrivateDirectory(home));
          const version = path.join(home, "v1");
          const paths = {
            home,
            events: path.join(version, "events"),
            temporary: path.join(version, "tmp"),
            setupLocks: path.join(version, "setup-locks"),
          };
          try {
            await ensureEventStore(paths);
            console.log("event-store-ok");
          } catch (error) {
            console.log(`event-store-${error?.code ?? "unknown"}`);
          }
          '@
          node --import tsx --input-type=module -e $probeScript
      - run: npm run check
      - run: npm run pack:smoke
